name: korulab
description: "Korulab: app educativa de ecología con cursos, retos y comunidad."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Backend: autenticación y base de datos
  supabase_flutter: ^2.18.2

  # Sesión y preferencias locales
  shared_preferences: ^2.2.0

  # Autenticación biométrica (huella, facial)
  local_auth: ^2.3.0

  # Imágenes de perfil
  image_picker: ^1.2.4
  crop_your_image: ^2.0.1

  # Notificaciones y feedback háptico
  flutter_local_notifications: ^22.3.1
  vibration: ^3.2.1

  # Tipografía (Nunito)
  google_fonts: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

# Regenerar con: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  # Icono completo (iOS, web y Android anterior a 8): degradado + logo blanco.
  image_path: "assets/images/icono_app.png"
  # Android 8+: el lanzador recorta el icono a su forma. El fondo es el
  # degradado de la marca (una capa transparente se vería negra en Samsung)
  # y el logo va dentro de la zona segura (66 % central) para verse completo.
  adaptive_icon_background: "assets/images/icono_fondo.png"
  adaptive_icon_foreground: "assets/images/icono_app_adaptable.png"
  # iOS no admite iconos transparentes.
  remove_alpha_ios: true
  background_color_ios: "#2E8B4F"
  web:
    generate: true
    image_path: "assets/images/icono_app.png"
    background_color: "#2E8B4F"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
